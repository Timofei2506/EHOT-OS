; /etc/gamemode.ini
; EHOT OS GameMode configuration tuned for 4 GB RAM + HDD laptop

[general]
reaper_freq=5
desiredgov=performance
igpu_desiredgov=powersave
igpu_power_threshold=0.3
softrealtime=auto
renice=10
ioprio=1
inhibit_screensaver=1

[filter]
; Allow standard Steam, Wine, Lutris, Java and Flatpak game processes
whitelist=
blacklist=
