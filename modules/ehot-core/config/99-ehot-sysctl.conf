# /etc/sysctl.d/99-ehot-sysctl.conf
# EHOT OS: Memory, ZRAM and HDD I/O tuning for 4 GB RAM + 1 TB HDD

# With ZRAM (priority 100) + slow HDD swapfile (priority 10), high swappiness
# favors fast RAM compression over dropping active file caches.
vm.swappiness = 100

# Read 1 page at a time from swap (optimal for ZRAM, prevents latency spikes)
vm.page-cluster = 0

# Retain directory/inode caches a bit longer to minimize HDD seeks
vm.vfs_cache_pressure = 50

# Prevent sudden kswapd stalls and keep small headroom for drivers/Wi-Fi
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Bound dirty writeback cache so copying files / game patches on 1 TB HDD
# does not stall the desktop for seconds
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
