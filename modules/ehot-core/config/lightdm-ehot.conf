# /etc/lightdm/slick-greeter.conf
# EHOT OS: Lightweight dark-violet LightDM greeter configuration
[Greeter]
background=#0B0914
draw-user-backgrounds=false
draw-grid=false
show-hostname=true
show-clock=true
clock-format=%H:%M
theme-name=Mint-Y-Dark-Purple
icon-theme-name=Papirus-Dark
enable-hidpi=auto
