# /etc/ehot-control/control.conf
# EHOT OS Control configuration (non-secret operational flags)
ENABLED=true
EVENT_YOUTUBE=true
EVENT_DOWNLOAD=true
EVENT_BOOT=true
EVENT_SHUTDOWN=true
YOUTUBE_DEBOUNCE_SECONDS=120
SOCKET_PATH=/run/ehot-control/events.sock
STATE_DIR=/var/lib/ehot-control
TELEGRAM_TIMEOUT_SECONDS=8
